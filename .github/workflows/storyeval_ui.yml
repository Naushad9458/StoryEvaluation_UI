name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    
    steps:
    - uses: actions/checkout@v3
    - name: Copy Folder
      run: |
        cp -r '/var/www/story_eval_ui/images_files' '/var/www/story_eval_ui/_work/StoryEvaluation_UI/StoryEvaluation_UI/public/'
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm i
    - run: CI=false npm run build --if-present
    
